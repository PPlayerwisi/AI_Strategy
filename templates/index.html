<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title id="page-title">Faction Warfare RTS</title>
    <link rel="stylesheet" href="/static/style.css?v=8" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="auth-screen">
      <div class="auth-card">
        <h2 id="lbl-auth-title">AUTHENTICATION</h2>
        <p id="lbl-auth-subtitle">Sign in or continue as guest.</p>
        <input
          type="text"
          id="auth-user"
          class="auth-input"
          placeholder="Username..."
        />
        <input
          type="password"
          id="auth-pass"
          class="auth-input"
          placeholder="Password..."
        />
        <div class="auth-btn-row">
          <button
            class="auth-btn"
            onclick="submitAuth('login')"
            id="lbl-btn-login"
          >
            Log In
          </button>
          <button
            class="auth-btn auth-btn-secondary"
            onclick="submitAuth('register')"
            id="lbl-btn-reg"
          >
            Register
          </button>
        </div>
        <button
          class="auth-btn auth-guest-btn"
          onclick="submitAuth('guest')"
          id="lbl-btn-guest"
        >
          Continue as Guest
        </button>
        <div id="auth-error" class="auth-error-msg"></div>
      </div>
    </div>

    <div id="app-container" class="mode-menu" style="display: none">
      <div id="left-pane">
        <canvas id="board" width="700" height="700"></canvas>
        <div id="floating-inspector" class="floating-inspector hidden"></div>
        <div id="unit-action-dock" class="action-dock hidden"></div>
      </div>

      <div id="right-pane">
        <div class="box profile-header-box">
          <div id="lbl-box-profile" class="box-title">COMMANDER PROFILE</div>
          <div class="profile-bar">
            <span id="current-user-display" class="profile-username"></span>
            <div class="profile-actions">
              <button
                id="btn-guide"
                class="btn-top-guide"
                onclick="openGuideModal()"
              >
                Guide
              </button>
              <button
                id="btn-logout"
                class="auth-btn-secondary"
                onclick="logoutUser()"
              >
                Logout
              </button>
              <button
                id="btn-lang"
                class="btn-top-lang"
                onclick="toggleLanguage()"
              >
                UK
              </button>
            </div>
          </div>
        </div>

        <div id="lobby-panel" class="menu-grid-layout">
          <div class="box lobby-create-box">
            <div id="lbl-box-createroom" class="box-title">Create New Room</div>
            <input
              type="text"
              id="room-name-inp"
              class="auth-input"
              placeholder="Room Name..."
            />
            <input
              type="password"
              id="room-pass-inp"
              class="auth-input"
              placeholder="Password (optional)..."
            />
            <div class="mode-radio-group">
              <label class="radio-pill"
                ><input type="radio" name="room-mode" value="2" checked />
                <span id="lbl-mode-2p">2 Players</span></label
              >
              <label class="radio-pill"
                ><input type="radio" name="room-mode" value="4" />
                <span id="lbl-mode-4p">4 Players</span></label
              >
            </div>
            <label class="check-row"
              ><input type="checkbox" id="room-fill-ai" checked />
              <span id="lbl-fill-ai">Fill empty slots with AI bots</span></label
            >
            <button
              class="btn-act btn-primary-cyan"
              onclick="createRoom()"
              id="lbl-btn-createroom"
            >
              Create Room
            </button>
            <button
              class="btn-act btn-ai-sim"
              onclick="aiSimulationPlaceholder()"
              id="lbl-btn-quickai"
            >
              AI Simulation
            </button>
          </div>

          <div class="box lobby-rooms-box">
            <div id="lbl-box-roomslist" class="box-title">
              Available Battle Rooms
            </div>
            <div id="rooms-list-container" class="rooms-container"></div>
          </div>
        </div>

        <div
          id="room-lobby-panel"
          class="room-staging-wrapper"
          style="display: none"
        >
          <div class="box staging-box">
            <div id="room-lobby-title" class="box-title staging-title">
              Room Lobby
            </div>
            <div id="room-slots-container" class="slots-grid-container"></div>
            <div class="staging-btn-row">
              <button
                id="btn-start-game"
                class="btn-act btn-start-match"
                style="display: none"
                onclick="roomAction('start')"
              >
                Start Battle
              </button>
              <button
                id="btn-leave-room"
                class="btn-act btn-leave-match"
                onclick="roomAction('leave')"
              >
                Leave Room
              </button>
            </div>
          </div>
        </div>

        <div id="game-control-panel" style="display: none">
          <div id="turn-status-banner" class="turn-banner turn-my"></div>

          <div class="box match-overview-box">
            <div class="overview-top-row">
              <div
                id="lbl-box-telemetry"
                class="box-title"
                style="margin-bottom: 0"
              >
                ROUND TELEMETRY
              </div>
              <div id="telemetry-text" class="match-meta-summary"></div>
            </div>
            <div id="gen-live-badge" class="gen-badge"></div>
            <div id="evo-banner"></div>
          </div>

          <div id="factions-telemetry-grid" class="factions-grid-4">
            <div id="f-card-1" class="faction-square f-theme-1"></div>
            <div id="f-card-2" class="faction-square f-theme-2"></div>
            <div id="f-card-3" class="faction-square f-theme-3"></div>
            <div id="f-card-4" class="faction-square f-theme-4"></div>
          </div>

          <div id="lbl-box-inspector" style="display: none"></div>
          <div id="inspector-text" style="display: none"></div>

          <div class="game-footer-buttons">
            <button
              id="b-stats"
              class="btn-act btn-stats"
              onclick="openStatsModal()"
            >
              Statistics
            </button>
            <button
              id="b-end"
              class="btn-act btn-end"
              onclick="sendAct('end_turn')"
            >
              End Turn
            </button>
            <div class="footer-sub-row">
              <button
                id="b-surrender"
                class="btn-act btn-surrender"
                onclick="confirmSurrender()"
              >
                Surrender
              </button>
              <button
                id="b-backlobby"
                class="btn-act btn-leave-secondary"
                onclick="roomAction('leave')"
              >
                Leave
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-overlay">
      <div id="modal-card">
        <div class="modal-header">
          <span id="lbl-modal-title" class="modal-title"
            >Efficiency Dynamics</span
          >
          <button
            id="btn-modal-close"
            onclick="closeStatsModal()"
            class="btn-close"
          >
            Close
          </button>
        </div>
        <div id="stats-summary" class="stats-summary-bar"></div>
        <canvas id="effChart" height="125"></canvas>
      </div>
    </div>

    <div id="guide-overlay">
      <div id="guide-card">
        <div class="modal-header">
          <span id="lbl-guide-title" class="modal-title">Tactical Guide</span>
          <button
            id="btn-guide-close"
            onclick="closeGuideModal()"
            class="btn-close"
          >
            Close
          </button>
        </div>
        <div id="guide-content"></div>
      </div>
    </div>

    <script src="/static/game.js?v=8"></script>
  </body>
</html>
