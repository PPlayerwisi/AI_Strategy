<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title id="page-title">Faction Warfare RTS</title>
    <link rel="stylesheet" href="/static/style.css?v=3" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="left-pane">
      <canvas id="board" width="700" height="700"></canvas>
    </div>

    <div id="right-pane">
      <div class="box">
        <div id="lbl-box-profile" class="box-title"></div>
        <div class="profile-bar">
          <input type="text" id="username-inp" value="" placeholder="" />
          <button id="btn-login" onclick="switchProfile()"></button>
          <button
            id="btn-lang"
            style="background: #576574; color: #ffffff; min-width: 44px"
            onclick="toggleLanguage()"
          ></button>
        </div>
      </div>

      <div class="box">
        <div id="lbl-box-telemetry" class="box-title"></div>
        <div id="telemetry-text"></div>
        <div id="gen-live-badge" class="gen-badge"></div>
        <div id="evo-banner"></div>
      </div>

      <div class="box">
        <div id="lbl-box-inspector" class="box-title"></div>
        <div id="inspector-text"></div>
      </div>

      <div class="box">
        <div id="lbl-box-orders" class="box-title"></div>
        <button
          id="b-heal"
          class="btn-act"
          style="background: #10ac84"
          onclick="sendAct('heal')"
        ></button>
        <button
          id="b-harv"
          class="btn-act"
          style="background: #d35400"
          onclick="sendAct('harvest')"
        ></button>
        <button
          id="b-tow"
          class="btn-act"
          style="background: #576574"
          onclick="sendAct('build', null, null, 'tower')"
        ></button>
        <button
          id="b-bar"
          class="btn-act"
          style="background: #576574"
          onclick="sendAct('build', null, null, 'barracks')"
        ></button>
        <button
          id="b-dem"
          class="btn-act"
          style="background: #8e44ad"
          onclick="sendAct('demolish')"
        ></button>
        <button
          id="b-dis"
          class="btn-act"
          style="background: #c0392b"
          onclick="sendAct('disband')"
        ></button>
        <button
          id="b-swk"
          class="btn-act"
          onclick="sendAct('spawn', null, null, 'worker')"
        ></button>
        <button
          id="b-swr"
          class="btn-act"
          onclick="sendAct('spawn', null, null, 'warrior')"
        ></button>
        <button
          id="b-sar"
          class="btn-act"
          onclick="sendAct('spawn', null, null, 'archer')"
        ></button>
      </div>

      <button
        id="b-stats"
        class="btn-act btn-stats"
        onclick="openStatsModal()"
      ></button>
      <button
        id="b-end"
        class="btn-act btn-end"
        onclick="sendAct('end_turn')"
      ></button>
    </div>

    <div id="modal-overlay">
      <div id="modal-card">
        <div class="modal-header">
          <span id="lbl-modal-title" class="modal-title"></span>
          <button
            id="btn-modal-close"
            onclick="closeStatsModal()"
            class="btn-close"
          ></button>
        </div>
        <div id="stats-summary"></div>
        <canvas id="effChart" height="125"></canvas>
      </div>
    </div>

    <script src="/static/game.js?v=3"></script>
  </body>
</html>
