<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title id="page-title">Faction Warfare RTS</title>
    <link rel="stylesheet" href="/static/style.css?v=6" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="auth-screen">
      <div class="auth-card">
        <h2 id="lbl-auth-title">AUTHENTICATION</h2>
        <p id="lbl-auth-subtitle">Sign in or continue as guest.</p>
        <input
          type="text"
          id="auth-user"
          class="auth-input"
          placeholder="Username..."
        />
        <input
          type="password"
          id="auth-pass"
          class="auth-input"
          placeholder="Password..."
        />
        <div class="auth-btn-row">
          <button
            class="auth-btn"
            onclick="submitAuth('login')"
            id="lbl-btn-login"
          >
            Log In
          </button>
          <button
            class="auth-btn auth-btn-secondary"
            onclick="submitAuth('register')"
            id="lbl-btn-reg"
          >
            Register
          </button>
        </div>
        <button
          class="auth-btn"
          style="
            width: 100%;
            margin-top: 10px;
            background: #10ac84;
            color: #fff;
          "
          onclick="submitAuth('guest')"
          id="lbl-btn-guest"
        >
          Continue as Guest
        </button>
        <div
          id="auth-error"
          style="color: #eb3b5a; font-size: 12px; margin-top: 10px"
        ></div>
      </div>
    </div>

    <div id="app-container" style="display: none">
      <div id="left-pane">
        <canvas id="board" width="700" height="700"></canvas>
      </div>

      <div id="right-pane">
        <div class="box">
          <div id="lbl-box-profile" class="box-title">USER PROFILE</div>
          <div class="profile-bar">
            <span
              id="current-user-display"
              style="
                font-weight: bold;
                color: #0abde3;
                flex: 1;
                font-size: 12.5px;
              "
            ></span>
            <button
              id="btn-guide"
              style="background: #f39c12; color: #182026"
              onclick="openGuideModal()"
            >
              Guide
            </button>
            <button
              id="btn-logout"
              class="auth-btn-secondary"
              onclick="logoutUser()"
            >
              Logout
            </button>
            <button
              id="btn-lang"
              style="background: #576574; color: #ffffff"
              onclick="toggleLanguage()"
            >
              UK
            </button>
          </div>
        </div>

        <div id="lobby-panel">
          <div class="box">
            <div id="lbl-box-createroom" class="box-title">Create Room</div>
            <input
              type="text"
              id="room-name-inp"
              class="auth-input"
              placeholder="Room Name..."
            />
            <input
              type="password"
              id="room-pass-inp"
              class="auth-input"
              placeholder="Password (optional)..."
            />
            <div
              style="display: flex; gap: 10px; margin: 8px 0; font-size: 12px"
            >
              <label
                ><input type="radio" name="room-mode" value="2" checked />
                <span id="lbl-mode-2p">2 Players</span></label
              >
              <label
                ><input type="radio" name="room-mode" value="4" />
                <span id="lbl-mode-4p">4 Players</span></label
              >
            </div>
            <label style="font-size: 12px; display: block; margin-bottom: 8px"
              ><input type="checkbox" id="room-fill-ai" />
              <span id="lbl-fill-ai">Fill with AI bots</span></label
            >
            <button
              class="btn-act"
              style="background: #0abde3; color: #182026"
              onclick="createRoom()"
              id="lbl-btn-createroom"
            >
              Create Room
            </button>
            <button
              class="btn-act"
              style="background: #e67e22"
              onclick="quickBotMatch()"
              id="lbl-btn-quickai"
            >
              Quick Match vs AI
            </button>
          </div>

          <div class="box" style="flex: 1">
            <div id="lbl-box-roomslist" class="box-title">Available Rooms</div>
            <div id="rooms-list-container" class="rooms-container"></div>
          </div>
        </div>

        <div id="room-lobby-panel" style="display: none">
          <div class="box">
            <div id="room-lobby-title" class="box-title" style="color: #0abde3">
              Room Lobby
            </div>
            <div id="room-slots-container" style="margin: 10px 0"></div>
            <div style="display: flex; gap: 8px">
              <button
                id="btn-start-game"
                class="btn-act"
                style="background: #2ecc71; color: #182026; display: none"
                onclick="roomAction('start')"
              >
                Start Game
              </button>
              <button
                id="btn-leave-room"
                class="btn-act"
                style="background: #eb3b5a"
                onclick="roomAction('leave')"
              >
                Leave Room
              </button>
            </div>
          </div>
        </div>

        <div
          id="game-control-panel"
          style="display: none; flex-direction: column; flex: 1"
        >
          <div id="turn-status-banner" class="turn-banner turn-my"></div>

          <div class="box">
            <div id="lbl-box-telemetry" class="box-title">
              SESSION TELEMETRY
            </div>
            <div id="telemetry-text"></div>
            <div id="gen-live-badge" class="gen-badge"></div>
            <div id="evo-banner"></div>
          </div>

          <div class="box">
            <div id="lbl-box-inspector" class="box-title">OBJECT INSPECTOR</div>
            <div id="inspector-text"></div>
          </div>

          <div class="box">
            <div id="lbl-box-orders" class="box-title">
              ORDERS & CONSTRUCTION
            </div>
            <div class="orders-grid">
              <button
                id="b-heal"
                class="btn-act"
                style="background: #10ac84"
                onclick="sendAct('heal')"
              >
                Heal
              </button>
              <button
                id="b-harv"
                class="btn-act"
                style="background: #d35400"
                onclick="sendAct('harvest')"
              >
                Harvest
              </button>
              <button
                id="b-tow"
                class="btn-act"
                style="background: #576574"
                onclick="sendAct('build', null, null, 'tower')"
              >
                Tower
              </button>
              <button
                id="b-bar"
                class="btn-act"
                style="background: #576574"
                onclick="sendAct('build', null, null, 'barracks')"
              >
                Barracks
              </button>
              <button
                id="b-dem"
                class="btn-act"
                style="background: #8e44ad"
                onclick="sendAct('demolish')"
              >
                Demolish
              </button>
              <button
                id="b-dis"
                class="btn-act"
                style="background: #c0392b"
                onclick="sendAct('disband')"
              >
                Disband
              </button>
              <button
                id="b-swk"
                class="btn-act"
                onclick="sendAct('spawn', null, null, 'worker')"
              >
                +Worker
              </button>
              <button
                id="b-swr"
                class="btn-act"
                onclick="sendAct('spawn', null, null, 'warrior')"
              >
                +Warrior
              </button>
              <button
                id="b-sar"
                class="btn-act orders-full-span"
                onclick="sendAct('spawn', null, null, 'archer')"
              >
                +Archer
              </button>
            </div>
          </div>

          <button
            id="b-stats"
            class="btn-act btn-stats"
            onclick="openStatsModal()"
          >
            Statistics
          </button>
          <button
            id="b-end"
            class="btn-act btn-end"
            onclick="sendAct('end_turn')"
          >
            End Turn
          </button>
          <div style="display: flex; gap: 6px; margin-top: 4px">
            <button
              id="b-surrender"
              class="btn-act btn-surrender"
              onclick="confirmSurrender()"
            >
              Surrender
            </button>
            <button
              id="b-backlobby"
              class="btn-act"
              style="background: #576574"
              onclick="roomAction('leave')"
            >
              Leave
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-overlay">
      <div id="modal-card">
        <div class="modal-header">
          <span id="lbl-modal-title" class="modal-title"
            >Efficiency Dynamics</span
          >
          <button
            id="btn-modal-close"
            onclick="closeStatsModal()"
            class="btn-close"
          >
            Close
          </button>
        </div>
        <div
          id="stats-summary"
          style="
            font-size: 12px;
            color: #c8d6e5;
            margin-bottom: 8px;
            line-height: 1.4;
          "
        ></div>
        <canvas id="effChart" height="125"></canvas>
      </div>
    </div>

    <div id="guide-overlay">
      <div id="guide-card">
        <div class="modal-header">
          <span id="lbl-guide-title" class="modal-title">Tactical Guide</span>
          <button
            id="btn-guide-close"
            onclick="closeGuideModal()"
            class="btn-close"
          >
            Close
          </button>
        </div>
        <div id="guide-content"></div>
      </div>
    </div>

    <script src="/static/game.js?v=6"></script>
  </body>
</html>
